<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARCADE HUB</title>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #050811;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-shell {
        width: 100%;
        max-width: 1020px;
        padding: 16px;
      }
      .hud-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 12px;
      }
      .hud-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .brand-title {
        font-weight: 800;
        letter-spacing: 1px;
        color: #38bdf8;
      }
      .mode-pill,
      .best-pill,
      .score-pill {
        background: #1e293b;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 13px;
      }
      .stage-box {
        position: relative;
        width: 100%;
        background: #090d1a;
        border: 1px solid #1e293b;
        border-radius: 14px;
        overflow: hidden;
        min-height: 460px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .overlay-screen {
        position: relative;
        z-index: 2;
        width: 100%;
        padding: 24px;
        text-align: center;
        background: rgba(5, 8, 17, 0.88);
      }
      .btn {
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 8px 14px;
        font-weight: 700;
        cursor: pointer;
        color: #f8fafc;
        background: #1e293b;
      }
      .btn-primary {
        background: #0284c7;
        border-color: #38bdf8;
      }
      .btn-secondary {
        background: #1e293b;
      }
      .btn-chip.active {
        background: #0ea5e9;
        border-color: #7dd3fc;
      }
      .btn-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .library-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
        margin-top: 12px;
        text-align: left;
      }
      .game-card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 10px;
        padding: 12px;
        color: #f8fafc;
        cursor: pointer;
        text-align: left;
      }
      .game-card:hover {
        border-color: #38bdf8;
      }
      .card-tag {
        font-size: 11px;
        color: #38bdf8;
        font-weight: 700;
      }
      .card-title {
        margin: 4px 0;
        font-size: 15px;
      }
      .card-desc {
        margin: 0;
        font-size: 12px;
        color: #94a3b8;
      }
      .hint-text {
        font-size: 12px;
        color: #94a3b8;
      }
      input {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #f8fafc;
        font-weight: 700;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useEffect, useRef, useState } from "react";
      import ReactDOM from "react-dom/client";

      const FIREBASE_DB_URL =
        "https://arcade-hub-mp-default-rtdb.europe-west1.firebasedatabase.app";

      const CANVAS_W = 800;
      const CANVAS_H = 450;

      const GAMES = [
        { id: "orbit", title: "Laser Dodge: Orbit", tag: "1P • REFLEKS", desc: "Lazer ışınlarından kaç, küre topla." },
        { id: "snake", title: "Neon Snake", tag: "1P • KLASİK", desc: "Büyüyen yılanla en yüksek skoru yap." },
        { id: "pong", title: "Cyber Pong", tag: "1P / 2P • ARKAD", desc: "Topu rakibin arkasından geçir." },
        { id: "breakout", title: "Prism Breaker", tag: "1P • ARKAD", desc: "Tüm neon blokları kır." },
        { id: "duel_snake", title: "Duel Snake", tag: "2P • KAPIŞMA", desc: "İki oyuncu aynı arenada kapışır." },
        { id: "arena_royale_4p", title: "Arena Royale", tag: "4P • ÇOKLU", desc: "4 oyunculu arena mücadelesi." }
      ];

      function generateCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let out = "";
        for (let i = 0; i < 5; i++) out += chars[Math.floor(Math.random() * chars.length)];
        return out;
      }

      function dbUrl(path) {
        return `${FIREBASE_DB_URL.replace(/\/+$/, "")}/${path.replace(/^\/+/, "")}.json`;
      }

      class RoomClient {
        constructor() {
          this.listeners = new Set();
          this.myId = "u_" + Math.random().toString(36).slice(2, 8);
          this.mySlot = 1;
          this.roomCode = "";
          this.snapshot = null;
          this.lastMatchSeq = 0;
          this.pollTimer = null;
          this.lastInputAt = 0;
        }

        subscribe(fn) {
          this.listeners.add(fn);
          if (this.snapshot) {
            fn({ type: "room_state", state: this.snapshot, mySlot: this.mySlot });
          }
          return () => this.listeners.delete(fn);
        }

        emit(ev) {
          this.listeners.forEach((fn) => fn(ev));
        }

        normalize(code, raw) {
          if (!raw || typeof raw !== "object") return null;
          const players = raw.players
            ? Object.values(raw.players).filter(Boolean).sort((a, b) => a.slot - b.slot)
            : [];
          return {
            roomCode: code,
            hostId: raw.hostId || this.myId,
            gameId: raw.gameId || "orbit",
            matchSeq: typeof raw.matchSeq === "number" ? raw.matchSeq : 0,
            players,
          };
        }

        async fetchRoom(code) {
          try {
            const res = await fetch(dbUrl(`rooms/${code}`), { cache: "no-store" });
            if (!res.ok) return null;
            return this.normalize(code, await res.json());
          } catch {
            return null;
          }
        }

        startPolling(code) {
          this.stopPolling();
          this.pollTimer = window.setInterval(async () => {
            if (!this.roomCode) return;
            const snap = await this.fetchRoom(code);
            if (!snap) return;
            this.snapshot = snap;
            const me = snap.players.find((p) => p.id === this.myId);
            if (me) this.mySlot = me.slot;
            this.emit({ type: "room_state", state: snap, mySlot: this.mySlot });
            if (snap.matchSeq > this.lastMatchSeq) {
              this.lastMatchSeq = snap.matchSeq;
              this.emit({ type: "match_started", gameId: snap.gameId });
            }
            try {
              const r = await fetch(dbUrl(`rooms/${code}/inputs`), { cache: "no-store" });
              if (r.ok) {
                const map = await r.json();
                if (map && typeof map === "object") {
                  [1, 2, 3, 4].forEach((s) => {
                    if (s === this.mySlot) return;
                    const entry = map[String(s)];
                    if (entry && entry.senderId && entry.senderId !== this.myId) {
                      this.emit({
                        type: "player_input",
                        slot: s,
                        input: { x: Number(entry.x) || 0, y: Number(entry.y) || 0, action: Boolean(entry.action) },
                      });
                    }
                  });
                }
              }
            } catch {}
          }, 200);
        }

        stopPolling() {
          if (this.pollTimer) {
            clearInterval(this.pollTimer);
            this.pollTimer = null;
          }
        }

        async createRoom(gameId) {
          const code = generateCode();
          this.roomCode = code;
          this.mySlot = 1;
          this.lastMatchSeq = 0;
          const snap = {
            roomCode: code,
            hostId: this.myId,
            gameId,
            matchSeq: 0,
            players: [{ id: this.myId, slot: 1, name: "Oyuncu 1" }],
          };
          try {
            await fetch(dbUrl(`rooms/${code}`), {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                ...snap,
                players: { [this.myId]: snap.players[0] },
              }),
            });
            this.snapshot = snap;
            this.startPolling(code);
            this.emit({ type: "status", message: `Oda kuruldu: ${code}` });
            this.emit({ type: "room_state", state: snap, mySlot: 1 });
          } catch {
            this.emit({ type: "error", message: "Firebase bağlantı hatası." });
          }
        }

        async joinRoom(rawCode) {
          const code = (rawCode || "").trim().toUpperCase();
          if (!code) {
            this.emit({ type: "error", message: "Oda kodu gir." });
            return;
          }
          const existing = await this.fetchRoom(code);
          if (!existing) {
            this.emit({ type: "error", message: `"${code}" odası bulunamadı.` });
            return;
          }
          const used = new Set(existing.players.map((p) => p.slot));
          const freeSlot = [1, 2, 3, 4].find((s) => !used.has(s));
          if (!freeSlot) {
            this.emit({ type: "error", message: "Oda dolu." });
            return;
          }
          this.roomCode = code;
          this.mySlot = freeSlot;
          this.lastMatchSeq = existing.matchSeq;
          const playerObj = { id: this.myId, slot: freeSlot, name: `Oyuncu ${freeSlot}` };
          await fetch(dbUrl(`rooms/${code}/players/${this.myId}`), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(playerObj),
          });
          const updated = (await this.fetchRoom(code)) || {
            ...existing,
            players: [...existing.players, playerObj],
          };
          this.snapshot = updated;
          this.startPolling(code);
          this.emit({ type: "status", message: `${code} odasına P${freeSlot} olarak katıldın.` });
          this.emit({ type: "room_state", state: updated, mySlot: freeSlot });
        }

        async startMatch(gameId) {
          if (!this.roomCode || !this.snapshot) return;
          const nextSeq = (this.snapshot.matchSeq || 0) + 1;
          this.lastMatchSeq = nextSeq;
          await fetch(dbUrl(`rooms/${this.roomCode}`), {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ gameId, matchSeq: nextSeq }),
          });
          this.emit({ type: "match_started", gameId });
        }

        sendInput(input) {
          if (!this.roomCode) return;
          const now = performance.now();
          if (now - this.lastInputAt < 60) return;
          this.lastInputAt = now;
          fetch(dbUrl(`rooms/${this.roomCode}/inputs/${this.mySlot}`), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              senderId: this.myId,
              x: input.x,
              y: input.y,
              action: Boolean(input.action),
            }),
          }).catch(() => {});
        }

        async leaveRoom() {
          const code = this.roomCode;
          this.stopPolling();
          if (code) {
            await fetch(dbUrl(`rooms/${code}/players/${this.myId}`), { method: "DELETE" }).catch(() => {});
          }
          this.roomCode = "";
          this.snapshot = null;
          this.mySlot = 1;
        }
      }

      const roomClient = new RoomClient();

      function App() {
        const [screen, setScreen] = useState("library");
        const [activeGame, setActiveGame] = useState("orbit");
        const [roomState, setRoomState] = useState(null);
        const [mySlot, setMySlot] = useState(1);
        const [joinCode, setJoinCode] = useState("");
        const [notice, setNotice] = useState("");
        const [score, setScore] = useState(0);

        const canvasRef = useRef(null);
        const remoteRef = useRef({
          1: { x: 0, y: 0, action: false },
          2: { x: 0, y: 0, action: false },
          3: { x: 0, y: 0, action: false },
          4: { x: 0, y: 0, action: false },
        });
        const mySlotRef = useRef(1);

        useEffect(() => {
          mySlotRef.current = mySlot;
        }, [mySlot]);

        useEffect(() => {
          return roomClient.subscribe((ev) => {
            if (ev.type === "room_state") {
              setRoomState(ev.state);
              setMySlot(ev.mySlot);
            } else if (ev.type === "match_started") {
              setActiveGame(ev.gameId);
              setScore(0);
              setScreen("game");
            } else if (ev.type === "player_input") {
              remoteRef.current[ev.slot] = ev.input;
            } else if (ev.type === "error" || ev.type === "status") {
              setNotice(ev.message);
            }
          });
        }, []);

        useEffect(() => {
          if (screen !== "game") return;
          const keys = {};
          const onDown = (e) => { keys[e.key.toLowerCase()] = true; };
          const onUp = (e) => { keys[e.key.toLowerCase()] = false; };
          window.addEventListener("keydown", onDown);
          window.addEventListener("keyup", onUp);

          let px = 200;
          let py = CANVAS_H / 2;
          let p2x = CANVAS_W - 200;
          let p2y = CANVAS_H / 2;
          let orbX = 520;
          let orbY = 220;
          let curScore = 0;
          let rafId = 0;
          let last = performance.now();

          const tick = (now) => {
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;

            let mx = 0;
            let my = 0;
            if (keys["a"] || keys["arrowleft"]) mx -= 1;
            if (keys["d"] || keys["arrowright"]) mx += 1;
            if (keys["w"] || keys["arrowup"]) my -= 1;
            if (keys["s"] || keys["arrowdown"]) my += 1;

            roomClient.sendInput({ x: mx, y: my, action: Boolean(keys[" "]) });

            const r2 = remoteRef.current[2];
            const speed = 260;

            if (mySlotRef.current === 1) {
              px = Math.max(20, Math.min(CANVAS_W - 20, px + mx * speed * dt));
              py = Math.max(20, Math.min(CANVAS_H - 20, py + my * speed * dt));
              p2x = Math.max(20, Math.min(CANVAS_W - 20, p2x + r2.x * speed * dt));
              p2y = Math.max(20, Math.min(CANVAS_H - 20, p2y + r2.y * speed * dt));
            } else {
              p2x = Math.max(20, Math.min(CANVAS_W - 20, p2x + mx * speed * dt));
              p2y = Math.max(20, Math.min(CANVAS_H - 20, p2y + my * speed * dt));
              const r1 = remoteRef.current[1];
              px = Math.max(20, Math.min(CANVAS_W - 20, px + r1.x * speed * dt));
              py = Math.max(20, Math.min(CANVAS_H - 20, py + r1.y * speed * dt));
            }

            if (Math.hypot(px - orbX, py - orbY) < 24 || Math.hypot(p2x - orbX, p2y - orbY) < 24) {
              curScore += 1;
              setScore(curScore);
              orbX = 80 + Math.random() * (CANVAS_W - 160);
              orbY = 70 + Math.random() * (CANVAS_H - 140);
            }

            const canvas = canvasRef.current;
            const ctx = canvas?.getContext("2d");
            if (canvas && ctx) {
              ctx.fillStyle = "#050811";
              ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

              ctx.strokeStyle = "#111827";
              ctx.lineWidth = 1;
              for (let x = 0; x < CANVAS_W; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_H); ctx.stroke();
              }
              for (let y = 0; y < CANVAS_H; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CANVAS_W, y); ctx.stroke();
              }

              ctx.fillStyle = "#fde047";
              ctx.beginPath();
              ctx.arc(orbX, orbY, 10, 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = "#38bdf8";
              ctx.beginPath();
              ctx.arc(px, py, 14, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#f8fafc";
              ctx.font = "bold 12px sans-serif";
              ctx.fillText("P1", px - 8, py - 18);

              ctx.fillStyle = "#fb7185";
              ctx.beginPath();
              ctx.arc(p2x, p2y, 14, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "#f8fafc";
              ctx.fillText("P2", p2x - 8, p2y - 18);
            }

            rafId = requestAnimationFrame(tick);
          };

          rafId = requestAnimationFrame(tick);
          return () => {
            cancelAnimationFrame(rafId);
            window.removeEventListener("keydown", onDown);
            window.removeEventListener("keyup", onUp);
          };
        }, [screen]);

        return (
          <div className="app-shell">
            <header className="hud-bar">
              <div className="hud-group">
                <span className="brand-title">ARCADE HUB</span>
                {roomState && <span className="mode-pill">ODA: {roomState.roomCode} (P{mySlot})</span>}
                {screen === "game" && <span className="score-pill">Skor: {score}</span>}
              </div>
              <div className="hud-group">
                {screen === "game" && (
                  <button className="btn btn-secondary" onClick={() => setScreen("library")}>
                    Kütüphane
                  </button>
                )}
              </div>
            </header>

            <main className="stage-box">
              {screen === "game" ? (
                <canvas ref={canvasRef} width={CANVAS_W} height={CANVAS_H} />
              ) : (
                <section className="overlay-screen">
                  <h1 style={{ margin: "0 0 8px" }}>ARCADE KÜTÜPHANESİ</h1>

                  {!roomState ? (
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        void roomClient.joinRoom(joinCode);
                      }}
                      className="btn-row"
                    >
                      <button
                        type="button"
                        className="btn btn-primary"
                        onClick={() => void roomClient.createRoom(activeGame)}
                      >
                        Oda Kur
                      </button>
                      <input
                        value={joinCode}
                        onChange={(e) => setJoinCode(e.target.value.toUpperCase())}
                        placeholder="ODA KODU"
                        maxLength={6}
                      />
                      <button type="submit" className="btn btn-secondary">
                        Kodla Katıl
                      </button>
                    </form>
                  ) : (
                    <div className="btn-row">
                      <span className="mode-pill">Kod: <strong>{roomState.roomCode}</strong></span>
                      <span className="best-pill">Sen: P{mySlot}</span>
                      <span className="mode-pill">
                        Oyuncular: {roomState.players.map((p) => `P${p.slot}`).join(", ")}
                      </span>
                      <button
                        type="button"
                        className="btn btn-primary"
                        onClick={() => void roomClient.startMatch(activeGame)}
                      >
                        Odayı Başlat
                      </button>
                      <button
                        type="button"
                        className="btn btn-secondary"
                        onClick={() => {
                          void roomClient.leaveRoom();
                          setRoomState(null);
                        }}
                      >
                        Ayrıl
                      </button>
                    </div>
                  )}

                  {notice && <p className="hint-text">{notice}</p>}

                  <div className="library-grid">
                    {GAMES.map((g) => (
                      <button
                        key={g.id}
                        className="game-card"
                        onClick={() => {
                          setActiveGame(g.id);
                          setScore(0);
                          setScreen("game");
                        }}
                      >
                        <div className="card-tag">{g.tag}</div>
                        <h3 className="card-title">{g.title}</h3>
                        <p className="card-desc">{g.desc}</p>
                      </button>
                    ))}
                  </div>
                  <p className="hint-text">WASD veya Yön Tuşları ile hareket et.</p>
                </section>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
